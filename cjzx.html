<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blender插件资产库</title><style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface2: #f0f0f2;
            --surface3: #e8e8ea;
            --text: #1a1a1a;
            --text2: #4a4a4a;
            --text3: #888888;
            --accent: #1a73e8;
            --accent-hover: #1557b0;
            --accent-dim: #d2e3fc;
            --green: #1e8e3e;
            --green-dim: #ceead6;
            --red: #d93025;
            --red-dim: #fce8e6;
            --border: #dadce0;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
        }

        body.dark-theme {
            --bg: #1a1d23;
            --surface: #21252b;
            --surface2: #282c34;
            --surface3: #2c313a;
            --text: #e1e4e8;
            --text2: #a0a6b0;
            --text3: #6e7681;
            --accent: #58a6ff;
            --accent-hover: #79b8ff;
            --accent-dim: #1f3a5f;
            --green: #3fb950;
            --green-dim: #1a3d22;
            --red: #f85149;
            --red-dim: #3d1a1a;
            --border: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ============ 自定义滚动条 ============ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--text3);
            border-radius: 3px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

        .card-grid::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar { width: 4px; }
        .card-grid::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb { background: transparent; }
        .card-grid:hover::-webkit-scrollbar-thumb,
        .sidebar:hover::-webkit-scrollbar-thumb { background: var(--text3); }
        .card-grid:hover::-webkit-scrollbar-thumb:hover,
        .sidebar:hover::-webkit-scrollbar-thumb:hover { background: var(--text2); }

        /* Firefox */
        * { scrollbar-width: thin; scrollbar-color: var(--text3) transparent; }
        .card-grid, .sidebar { scrollbar-width: thin; scrollbar-color: transparent transparent; }
        .card-grid:hover, .sidebar:hover { scrollbar-color: var(--text3) transparent; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            user-select: none;
        }
        input, textarea, .card-desc, .card-title, .card-source { user-select: text; }

        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 12px;
        }
        .logo { font-weight: 700; font-size: 1.1rem; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .header-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
            border-radius: 6px; border: 1px solid var(--border); background: var(--surface2);
            color: var(--text); cursor: pointer; font-size: 0.8rem; font-weight: 500;
            transition: all 0.15s; white-space: nowrap; text-decoration: none; font-family: inherit;
        }
        .btn:hover { background: var(--surface3); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: transparent; border-color: var(--red-dim); color: var(--red); }
        .btn-danger:hover { background: var(--red-dim); }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
        .btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; border-radius: 50%; font-size: 1rem; }

        .sidebar-toggle {
            display: flex !important;
        }

        .app-body { display: flex; height: calc(100vh - 56px); overflow: hidden; }

        .sidebar {
            width: 240px; min-width: 240px; background: var(--surface);
            border-right: 1px solid var(--border); padding: 12px 10px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
            transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
        }
        /* 桌面端折叠状态 */
        .sidebar.sidebar-hidden {
            width: 0 !important;
            min-width: 0 !important;
            padding: 0 !important;
            border: none;
            opacity: 0;
        }
        .sidebar h3 { font-size: 0.7rem; text-transform: uppercase; color: var(--text3); padding: 8px 6px; font-weight: 600; }
        .cat-btn {
            display: flex; align-items: center; gap: 8px; padding: 8px 10px;
            border-radius: 6px; border: none; background: transparent; color: var(--text2);
            cursor: pointer; font-size: 0.85rem; width: 100%; text-align: left;
            transition: all 0.15s; font-family: inherit;
        }
        .cat-btn:hover { background: var(--surface2); color: var(--text); }
        .cat-btn.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
        .cat-btn .badge { margin-left: auto; background: var(--surface3); padding: 2px 8px; border-radius: 10px; font-size: 0.65rem; }
        .cat-btn.active .badge { background: var(--accent); color: #fff; }
        .sidebar-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar {
            padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .search-box { flex: 1; position: relative; min-width: 160px; }
        .search-box input {
            width: 100%; padding: 8px 12px 8px 32px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 6px; color: var(--text);
            font-size: 0.85rem; font-family: inherit; user-select: text;
        }
        .search-box span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); }
        .filter-tags { display: flex; gap: 4px; }
        .filter-tag {
            padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border);
            background: transparent; color: var(--text2); cursor: pointer; font-size: 0.7rem; font-family: inherit;
        }
        .filter-tag.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

        .card-grid { flex: 1; overflow-y: auto; padding: 16px; }
        .card-grid.list-view .card-image,
        .card-grid.list-view .card-image-placeholder { display: none !important; }

        .category-section { margin-bottom: 30px; }
        .category-title {
            font-size: 1.2rem; font-weight: 600; margin-bottom: 12px;
            padding-bottom: 6px; border-bottom: 1px solid var(--border);
        }
        .plugin-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
        }
        .card-grid.list-view .plugin-grid { grid-template-columns: 1fr; max-width: 800px; margin: 0 auto; }

        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative;
        }
        .card.installed { border-left: 3px solid var(--green); }
        .card-image {
            width: 100%; height: 120px; border-radius: var(--radius-sm); object-fit: cover;
            background: var(--surface2); border: 1px solid var(--border);
            cursor: pointer;
        }
        .card-image-placeholder {
            width: 100%; height: 120px; border-radius: var(--radius-sm); background: var(--surface2);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            color: var(--text3); border: 1px dashed var(--border);
            cursor: pointer;
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .card-title { font-weight: 600; font-size: 0.9rem; word-break: break-word; flex: 1; }

        /* 拖拽手柄 */
        .drag-handle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; cursor: grab; color: var(--text3);
            font-size: 1rem; line-height: 1; border-radius: 3px; flex-shrink: 0;
            margin-right: 4px; user-select: none;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle:hover { background: var(--surface3); color: var(--text); }

        .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 8px; font-weight: 500; }
        .badge-version { background: #f97316; color: #ffffff; }
        .badge-installed { background: var(--green-dim); color: var(--green); }
        .install-btn {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
            background: transparent; cursor: pointer; font-size: 0.65rem; color: transparent;
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
            pointer-events: auto;
        }
        .card.installed .install-btn { border-color: var(--green); background: var(--green); color: #fff; }
        .card-desc { font-size: 0.78rem; color: var(--text2); flex: 1; }
        .card-source { font-size: 0.7rem; color: var(--text3); margin-top: 4px; }
        .card-actions { display: flex; gap: 4px; margin-top: auto; }
        .card-link {
            display: inline-flex; align-items: center; gap: 3px; padding: 5px 8px;
            border-radius: 5px; background: var(--accent-dim); color: var(--accent);
            text-decoration: none; font-size: 0.72rem; font-weight: 500;
            pointer-events: auto;
        }
        .batch-checkbox {
            position: absolute; top: 8px; left: 8px; width: 18px; height: 18px;
            cursor: pointer; z-index: 3; display: none; pointer-events: auto;
        }
        .card-grid.batch-mode .batch-checkbox { display: block; }

        /* 拖拽状态样式 */
        .card.dragging { opacity: 0.4; }
        .card.drag-over { border: 2px solid var(--accent) !important; }
        .card.drag-above { border-top: 3px solid var(--accent) !important; }
        .card.drag-below { border-bottom: 3px solid var(--accent) !important; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; align-items: center; justify-content: center; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 20px; }
        .modal h2 { margin-bottom: 16px; font-size: 1.1rem; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text2); margin-bottom: 3px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 5px; color: var(--text); font-size: 0.85rem; font-family: inherit; user-select: text;
        }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }
        .modal-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 16px; }

        /* ============ 多余缩略图检测弹窗 ============ */
        .img-check-summary { display: flex; gap: 12px; margin-bottom: 12px; font-size: 0.8rem; flex-wrap: wrap; }
        .img-check-stat { background: var(--surface2); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); }
        .img-check-stat strong { font-size: 1.1rem; }
        .img-check-stat.warn { border-color: var(--red-dim); color: var(--red); }
        .img-check-list { max-height: 350px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
        .img-check-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.78rem; font-family: 'Consolas', 'Courier New', monospace; }
        .img-check-item:last-child { border-bottom: none; }
        .img-check-item:hover { background: var(--surface2); }
        .img-check-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
        .img-check-item .img-preview { width: 40px; height: 30px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; background: var(--surface3); }
        .img-check-toolbar { display: flex; gap: 6px; align-items: center; padding: 8px 0; }
        .img-check-empty { text-align: center; padding: 40px; color: var(--green); font-size: 0.9rem; }
        .img-check-empty .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
        .img-check-drop { border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center; color: var(--text3); cursor: pointer; transition: all 0.2s; }
        .img-check-drop:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .img-check-drop .icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }

        .cat-edit-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .cat-edit-row input { flex: 1; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.85rem; }
        .cat-edit-row .icon-input { width: 50px; flex: none; text-align: center; }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 6px; }
        .toast { padding: 10px 16px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 0.8rem; animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 480px) {
            .sidebar {
                position: absolute;
                z-index: 200;
                height: calc(100vh - 56px);
                left: 0;
                top: 56px;
                width: 260px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: 4px 0 12px rgba(0,0,0,0.3);
            }
            .sidebar.sidebar-hidden {
                transform: translateX(-100%);
                width: 260px !important;  /* 保持原有宽度用于动画 */
                min-width: 260px !important;
                padding: 12px 10px !important;
                opacity: 1;
                border-right: 1px solid var(--border);
            }
            .sidebar:not(.sidebar-hidden) {
                transform: translateX(0);
            }
            .plugin-grid { grid-template-columns: 1fr !important; }
        }
